services:
  hadoop:
    build: ./hadoop
    container_name: hadoop
    volumes:
      - ./ventas_125053447.csv:/data/input/ventas_125053447.csv:ro
      - ./mapreduce:/app/mapreduce
      - ./output:/data/output
    networks: [red]
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [red]
  api:
    build: ./api
    env_file: .env
    ports:
      - "5000:5000"
    depends_on: [db]
    networks: [red]
volumes:
  pgdata:
networks:
  red:
